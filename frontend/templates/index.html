<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSI Camera – {{ mode }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
    }
    .header {
      padding: 0.75rem 1rem;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
    }
    .header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 52px);
      padding: 1rem;
    }
    .container img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>CSI Camera (GStreamer) – {{ mode }}</h1>
  </div>
  <div class="container">
    <img src="/video_feed" alt="Camera stream">
  </div>
</body>
</html>
