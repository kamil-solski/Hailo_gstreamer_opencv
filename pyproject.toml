[project]
name = "test-opencv"
version = "0.1.0"
description = "CSI camera GStreamer web app with ONNX/Hailo inference on Raspberry Pi 5"
requires-python = ">=3.11"

dependencies = [
    "flask>=2.2",
    "numpy>=1.24,<2",  # OpenCV .so is compiled against NumPy 1.x ABI
    # Jupyter for the notebook container
    "notebook>=7.0",
    "ipykernel>=6.0",
    # cv2 is intentionally absent — built from source inside Docker with GStreamer support.
    # hailo_platform is intentionally absent — installed via Hailo SDK .deb / bind-mounted from host.
]

[tool.uv]
# To install Hailo wheels locally, place them in ./wheels/ and uncomment:
# find-links = ["./wheels/"]
